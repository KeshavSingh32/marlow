spring:
  datasource:
    url: jdbc:h2:mem:marlow;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate.dialect: org.hibernate.dialect.H2Dialect
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always
  rabbitmq:
    listener:
      simple:
        auto-startup: false

marlow:
  zone: Asia/Kolkata
  storage:
    uploads: ${java.io.tmpdir}/marlow-test-uploads
  ai:
    mode: heuristic
    openai-api-key: ""
