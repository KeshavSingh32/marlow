server:
  port: 8097
  address: 0.0.0.0

spring:
  application:
    name: marlow
  datasource:
    url: jdbc:postgresql://localhost:5432/marlow
    username: marlow
    password: marlow
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate.jdbc.time_zone: UTC
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        auto-startup: true
        default-requeue-rejected: false
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

marlow:
  zone: Asia/Kolkata
  storage:
    uploads: ./data/uploads
  ai:
    # AI analysis through Spring AI. The defaults call Gemini through its OpenAI-compatible API.
    # Without a key, or if a call fails, the rule-based reader is used instead.
    mode: ${MARLOW_AI_MODE:openai}
    openai-api-key: ${GEMINI_API_KEY:${OPENAI_API_KEY:}}
    model: ${MARLOW_AI_MODEL:gemini-3.1-flash-lite}
    base-url: ${MARLOW_AI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai}
    completions-path: ${MARLOW_AI_COMPLETIONS_PATH:/chat/completions}
    # Pause between AI calls so CSV imports stay under the per-minute limit
    min-interval-ms: ${MARLOW_AI_MIN_INTERVAL_MS:4500}

logging:
  level:
    com.marlow: INFO
