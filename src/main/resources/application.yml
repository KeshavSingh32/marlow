server:
  port: 8097
  address: 0.0.0.0

spring:
  application:
    name: marlow
  datasource:
    url: jdbc:postgresql://localhost:5432/marlow
    username: marlow
    password: marlow
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate.jdbc.time_zone: UTC
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        auto-startup: true
        default-requeue-rejected: false
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

marlow:
  zone: Asia/Kolkata
  storage:
    uploads: ./data/uploads
  ai:
    # heuristic runs on this machine. Set MARLOW_AI_MODE=openai and OPENAI_API_KEY to use Spring AI.
    mode: ${MARLOW_AI_MODE:heuristic}
    openai-api-key: ${OPENAI_API_KEY:}
    model: ${MARLOW_AI_MODEL:gpt-4o-mini}

logging:
  level:
    com.marlow: INFO
